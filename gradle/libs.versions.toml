# 版本目录 —— 全部围绕「本机能离线拿到什么」来选，不要随手升版本。
#
# 关键约束（实测）：
#   * AGP 8.5.2   ：缓存里 7.2.2 / 8.5.2 / 9.3.0 可用，9.x 要 Gradle 9（下不到）。
#   * Kotlin 2.0.20：与 AGP 8.5.2 配套，已验证。
#   * compileSdk 34：SDK 管理器无法联网补装，只能用已装的 android-34。
#
# 上面几条来自原开发机（Windows + D:\gradle-home 离线缓存）；沙箱里能联网
# （走代理），但版本保持不变，免得两台机器的产物不一致。
#
# 界面全部由 C + LVGL 绘制，Kotlin 侧只剩一个 MainActivity（SurfaceView 宿主），
# 依赖因此只有 core-ktx（WindowCompat / WindowInsetsControllerCompat）。
# 旧 Compose 版用到的 compose-bom / material / activity-compose / lifecycle /
# coroutines / junit 和 kotlin-compose 插件都已随 Kotlin 源码删掉，不要加回来。

[versions]
agp = "8.5.2"
kotlin = "2.0.20"
coreKtx = "1.13.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
